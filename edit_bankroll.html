{% extends "base.html" %}

{% block content %}
<div class="card-metrika">
  <div class="card-header">
    <h3 class="card-title-sub">Edit Bankroll</h3>
    <a href="{{ url_for('bankrolls_list') }}" class="link-green">← Back</a>
  </div>

  <form action="{{ url_for('edit_bankroll', roll_id=bankroll.id) }}" method="POST">
    <div class="form-group-custom">
      <label>Name</label>
      <input type="text" name="name" value="{{ bankroll.name }}" required>
    </div>

    <div class="form-grid-2">
      <div class="form-group-custom">
        <label>Currency</label>
        <input type="text" name="currency" value="{{ bankroll.currency }}" required>
      </div>
      <div class="form-group-custom">
        <label>Starting Balance (€)</label>
        <input type="number" step="0.01" name="starting_balance" value="{{ bankroll.starting_balance }}" required>
      </div>
    </div>

    <button type="submit" class="btn-metrika-green">Update Bankroll</button>
  </form>
</div>
{% endblock %}
