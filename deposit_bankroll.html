{% extends "base.html" %}

{% block content %}
<div class="card-metrika">
  <div class="card-header">
    <h3 class="card-title-sub">Deposit to {{ bankroll.name }}</h3>
    <a href="{{ url_for('bankrolls_list') }}" class="link-green">← Back</a>
  </div>

  <form action="{{ url_for('deposit_bankroll', roll_id=bankroll.id) }}" method="POST">
    <div class="form-group-custom">
      <label>Amount ({{ bankroll.currency }})</label>
      <input type="number" step="0.01" name="amount" placeholder="0.00" required>
    </div>

    <div class="form-group-custom">
      <label>Bookmaker (optional)</label>
      <select name="bookmaker_id">
        <option value="">Select Bookmaker (optional)</option>
        {% for book in bookmakers %}
        <option value="{{ book.id }}">{{ book.name }}</option>
        {% endfor %}
      </select>
      <small style="color: var(--text-muted); font-size: 0.75rem;">Select a bookmaker to track where the deposit went</small>
    </div>

    <div class="form-group-custom">
      <label>Notes (optional)</label>
      <input type="text" name="notes" placeholder="e.g. Initial deposit, bonus, etc.">
    </div>

    <button type="submit" class="btn-metrika-green">Record Deposit</button>
  </form>
</div>
{% endblock %}
