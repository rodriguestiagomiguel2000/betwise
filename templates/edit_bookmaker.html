{% extends "base.html" %}

{% block content %}
<div class="card-metrika">
  <div class="card-header">
    <h3 class="card-title-sub">Edit Bookmaker</h3>
    <a href="{{ url_for('bookmakers_list', bankroll_id=selected_bankroll_id) }}" class="link-green">← Back</a>
  </div>

  <form action="{{ url_for('edit_bookmaker', book_id=bookmaker.id) }}" method="POST">
    <input type="hidden" name="bankroll_id" value="{{ selected_bankroll_id or '' }}">
    
    <div class="form-group-custom">
      <label>Bookmaker Name</label>
      <input type="text" name="name" value="{{ bookmaker.name }}" required>
      <small style="color: var(--text-muted); font-size: 0.7rem;">This is global for all bankrolls</small>
    </div>

    <div class="form-group-custom">
      <label>Bankroll</label>
      <select name="bankroll_id_display" class="input-metrika" disabled>
        {% if selected_bankroll_id %}
          {% for b in all_bankrolls %}
            {% if b.id == selected_bankroll_id|int %}
            <option value="{{ b.id }}" selected>{{ b.name }}</option>
            {% endif %}
          {% endfor %}
        {% else %}
          <option value="">No bankroll selected</option>
        {% endif %}
      </select>
      <small style="color: var(--text-muted); font-size: 0.7rem;">Starting balance is specific to this bankroll</small>
    </div>

    <div class="form-grid-2">
      <div class="form-group-custom">
        <label>Currency</label>
        <input type="text" name="currency" value="{{ bookmaker.currency or 'EUR' }}" required>
      </div>
      <div class="form-group-custom">
        <label>Starting Balance for this Bankroll (€)</label>
        <input type="number" step="0.01" name="starting_balance" value="{{ current_starting or 0 }}" required>
        <small style="color: var(--text-muted); font-size: 0.7rem;">This only affects the selected bankroll</small>
      </div>
    </div>

    <button type="submit" class="btn-metrika-submit">Update Bookmaker</button>
  </form>
</div>
{% endblock %}
