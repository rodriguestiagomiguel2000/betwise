<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register · BETWISE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=6">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, sans-serif;
      background-image: 
        radial-gradient(ellipse at 20% 50%, rgba(99, 102, 241, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 50%, rgba(236, 72, 153, 0.06) 0%, transparent 60%);
    }

    .auth-container {
      width: 100%;
      max-width: 420px;
      padding: 1rem;
    }

    .auth-card {
      background: rgba(17, 20, 24, 0.72);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 22px;
      padding: 2.5rem 2rem;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-logo h1 {
      font-size: 1.65rem;
      font-weight: 700;
      background: linear-gradient(135deg, #22e0a4, #18c794);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }

    .auth-logo span {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.3);
      display: block;
      margin-top: 0.2rem;
      font-weight: 400;
    }

    .auth-subtitle {
      text-align: center;
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.85rem;
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .form-group input {
      width: 100%;
      padding: 0.78rem 1rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      color: #f3f6fb;
      font-size: 0.92rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      outline: none;
      font-family: 'Inter', sans-serif;
    }

    .form-group input:focus {
      border-color: #22e0a4;
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 0 3px rgba(34, 224, 164, 0.12);
    }

    .form-group input::placeholder {
      color: rgba(255, 255, 255, 0.2);
    }

    .btn-auth {
      width: 100%;
      padding: 0.82rem;
      background: linear-gradient(135deg, #22e0a4, #18c794);
      border: none;
      border-radius: 12px;
      color: #05130d;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
      font-family: 'Inter', sans-serif;
      box-shadow: 0 6px 20px rgba(34, 224, 164, 0.22);
      letter-spacing: 0.01em;
    }

    .btn-auth:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(34, 224, 164, 0.32);
    }

    .btn-auth:active { transform: translateY(0); }

    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      color: rgba(255, 255, 255, 0.3);
      font-size: 0.85rem;
    }

    .auth-footer a {
      color: #22e0a4;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    .auth-footer a:hover {
      color: #18c794;
    }

    .flash-messages {
      margin-bottom: 1.5rem;
    }

    .flash-message {
      padding: 0.75rem 1rem;
      border-radius: 12px;
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
    }

    .flash-message.success {
      background: rgba(34, 224, 164, 0.1);
      border: 1px solid rgba(34, 224, 164, 0.22);
      color: #22e0a4;
    }

    .flash-message.error {
      background: rgba(251, 111, 114, 0.1);
      border: 1px solid rgba(251, 111, 114, 0.22);
      color: #fb6f72;
    }

    .flash-message.warning {
      background: rgba(245, 196, 81, 0.1);
      border: 1px solid rgba(245, 196, 81, 0.22);
      color: #f5c451;
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>

<div class="auth-container">
  <div class="auth-card">
    <!-- Logo -->
    <div class="auth-logo">
      <h1>📊 BETWISE</h1>
      <span>analytics · betting</span>
    </div>

    <div class="auth-subtitle">
      Create your account 🚀
    </div>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-messages">
          {% for category, message in messages %}
            <div class="flash-message {{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <!-- Register Form -->
    <form method="POST">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="Choose a username" required autofocus>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Create a password" required>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" name="confirm_password" placeholder="Confirm your password" required>
      </div>

      <button type="submit" class="btn-auth">Create Account</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="{{ url_for('login') }}">Log in</a>
    </div>
  </div>
</div>

</body>
</html>
