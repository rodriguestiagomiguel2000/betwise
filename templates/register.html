<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register · BETWISE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=3">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, sans-serif;
      background-image: 
        radial-gradient(ellipse at 20% 50%, rgba(99, 102, 241, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 50%, rgba(236, 72, 153, 0.06) 0%, transparent 60%);
    }

    .auth-container {
      width: 100%;
      max-width: 420px;
      padding: 1rem;
    }

    .auth-card {
      background: rgba(20, 20, 22, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-logo h1 {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(135deg, #00d4aa, #00b894);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-logo span {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.3);
      display: block;
      margin-top: 0.2rem;
      font-weight: 400;
    }

    .auth-subtitle {
      text-align: center;
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.85rem;
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      color: #e8e8e8;
      font-size: 0.95rem;
      transition: all 0.3s;
      outline: none;
      font-family: 'Inter', sans-serif;
    }

    .form-group input:focus {
      border-color: #00d4aa;
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 30px rgba(0, 212, 170, 0.05);
    }

    .form-group input::placeholder {
      color: rgba(255, 255, 255, 0.2);
    }

    .btn-auth {
      width: 100%;
      padding: 0.8rem;
      background: linear-gradient(135deg, #00d4aa, #00b894);
      border: none;
      border-radius: 10px;
      color: #0a0a0a;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      font-family: 'Inter', sans-serif;
    }

    .btn-auth:hover {
      transform: scale(1.01);
      box-shadow: 0 0 40px rgba(0, 212, 170, 0.2);
    }

    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      color: rgba(255, 255, 255, 0.3);
      font-size: 0.85rem;
    }

    .auth-footer a {
      color: #00d4aa;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .auth-footer a:hover {
      color: #00b894;
    }

    .flash-messages {
      margin-bottom: 1.5rem;
    }

    .flash-message {
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
    }

    .flash-message.success {
      background: rgba(0, 212, 170, 0.1);
      border: 1px solid rgba(0, 212, 170, 0.2);
      color: #00d4aa;
    }

    .flash-message.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }

    .flash-message.warning {
      background: rgba(234, 179, 8, 0.1);
      border: 1px solid rgba(234, 179, 8, 0.2);
      color: #eab308;
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>

<div class="auth-container">
  <div class="auth-card">
    <!-- Logo -->
    <div class="auth-logo">
      <h1>📊 BETWISE</h1>
      <span>analytics · betting</span>
    </div>

    <div class="auth-subtitle">
      Create your account 🚀
    </div>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-messages">
          {% for category, message in messages %}
            <div class="flash-message {{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <!-- Register Form -->
    <form method="POST">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="Choose a username" required autofocus>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Create a password" required>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" name="confirm_password" placeholder="Confirm your password" required>
      </div>

      <button type="submit" class="btn-auth">Create Account</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="{{ url_for('login') }}">Log in</a>
    </div>
  </div>
</div>

</body>
</html>
