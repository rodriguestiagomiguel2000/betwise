# render.yaml
services:
  - type: web
    name: betwise
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: FLASK_ENV
        value: production
    healthCheckPath: /health
    plan: free

  - type: cron
    name: backup-db
    schedule: "0 */6 * * *"  # A cada 6 horas
    runtime: python
    buildCommand: pip install -r requirements.txt
    command: python backup_db.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    plan: free